# Checks on every push and pull request: the plan compiles, both projects typecheck, every unit and Worker test passes and the
# app builds. The browser tests (about ten minutes) run every night and on demand; screenshot baselines are per machine and
# not in git, so the visual specs are left out here.
name: ci
on:
  push: { branches: [main] }
  pull_request: {}
  schedule: [{ cron: '30 21 * * *' }] # 03:00 in Kolkata
  workflow_dispatch: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - run: npm run compile
      - run: npx tsc --noEmit
      - run: npx tsc --noEmit -p worker/tsconfig.json
      - run: npx vitest run
      - run: npm run build

  e2e:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (not the screenshot specs)
        run: npx playwright test $(ls e2e/*.spec.ts | grep -v -E 'screens|epaper|print')
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
