# Study links rot. Once a week every video and doc in the plan is checked, and the run fails (and GitHub emails you) if one is gone.
name: links
on:
  schedule: [{ cron: '30 3 * * 1' }] # Monday, 09:00 in Kolkata
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - run: npm run compile
      - run: npm run check:links
