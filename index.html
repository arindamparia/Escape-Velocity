    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Set the theme before first paint, so there is no flash. The synced setting wins afterwards.
      (function () {
        try {
          var p = localStorage.getItem('ev:theme') || 'system'
          var t = p === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : p
          document.documentElement.setAttribute('data-theme', t)
          document.documentElement.setAttribute('data-theme-pref', p)
        } catch (e) {}
      })()
    </script>
